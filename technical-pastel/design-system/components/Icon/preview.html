<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.setAttribute('data-theme', new URLSearchParams(location.search).get('theme') || 'light');</script>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script src="../vendor/react.production.min.js"></script>

<script src="../bundle.js"></script><meta charset="utf-8"><title>Icon</title>
<style>.stage{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:4px;padding:16px}.cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;color:var(--ink)}.cell span{font-family:var(--font-mono);font-size:11px;line-height:14px;font-weight:500;letter-spacing:.02em;color:var(--ink-muted)}</style></head>
<body>
<div id="root" class="stage"></div>
<script>
  var P = window.TechnicalPastel, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    P.Icon.names.map(function (n) { return h('div', { key: n, className: 'cell' }, h(P.Icon, { name: n, size: 24 }), h('span', null, n)); })));
</script>
</body>

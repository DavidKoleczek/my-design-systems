<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.setAttribute('data-theme', new URLSearchParams(location.search).get('theme') || 'light');</script>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<script src="../vendor/react.production.min.js"></script>
<script src="../vendor/react-dom.production.min.js"></script>
<script src="../bundle.js"></script><meta charset="utf-8"><title>Panel</title>
<style>body{background:var(--canvas)}.stage{width:300px;padding:16px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:4px}</style></head>
<body>
<div id="root" class="stage"></div>
<script>
  var P = window.TechnicalPastel, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(P.Panel, { title: 'Transform', actions: h(P.Button, { variant: 'ghost', size: 'sm', icon: 'more', 'aria-label': 'Transform options' }) },
      h('div', { className: 'pair' },
        h(P.ValueField, { label: 'X', defaultValue: 240, min: -9999, max: 9999, unit: 'px', bar: false, size: 'sm' }),
        h(P.ValueField, { label: 'Y', defaultValue: 128, min: -9999, max: 9999, unit: 'px', bar: false, size: 'sm' }),
        h(P.ValueField, { label: 'W', defaultValue: 640, min: 0, max: 9999, unit: 'px', bar: false, size: 'sm' }),
        h(P.ValueField, { label: 'H', defaultValue: 360, min: 0, max: 9999, unit: 'px', bar: false, size: 'sm' })),
      h(P.ValueField, { label: 'Rotation', defaultValue: 15, min: 0, max: 360, unit: '°', size: 'sm' })),
    h(P.Panel, { title: 'Appearance', defaultOpen: false }),
    h(P.Panel, { title: 'Export', defaultOpen: false })));
</script>
</body>
</html>

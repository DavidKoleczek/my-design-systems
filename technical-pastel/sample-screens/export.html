<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Export dialog</title>
<link rel="stylesheet" href="technical-pastel/tokens.css">
<link rel="stylesheet" href="technical-pastel/components/bundle.css">
<style>body{margin:0}
a{color:inherit}a:hover{color:inherit}</style>
<script src="technical-pastel/components/vendor/react.production.min.js"></script>
<script src="technical-pastel/components/vendor/react-dom.production.min.js"></script>
<script src="technical-pastel/components/bundle.js"></script>
</head>
<body>
<div data-theme="light" style="min-height: 100vh; position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 48px 16px; box-sizing: border-box; background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-size: 13px; line-height: 20px;">
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20, 20, 20, 0.4);"></div>

<div role="dialog" aria-modal="true" aria-labelledby="export-title" style="position: relative; width: 760px; max-width: 100%; background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-popover); overflow: hidden;">
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 12px 14px 20px; border-bottom: 1px solid var(--line);">
<div style="flex: 1; min-width: 0;">
<h1 id="export-title" style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; letter-spacing: -0.01em;">Export frames</h1>
<p style="margin: 0; font-size: 12px; line-height: 16px; color: var(--ink-muted);">Spring campaign poster</p>
</div>
<x-import component-from-global-scope="TechnicalPastel.Button" variant="ghost" icon="close" aria-label="Close"></x-import>
</div>

<div style="display: flex; flex-wrap: wrap;">
<div style="flex: 1 1 340px; min-width: 0; position: relative; display: flex; align-items: center; justify-content: center; padding: 56px 64px 48px 40px; box-sizing: border-box; background: var(--canvas); border-right: 1px solid var(--line);">
<div style="position: relative; width: 216px; height: 270px;">
<div role="img" aria-label="Preview of the poster" style="position: absolute; inset: 0; background: #fff3d6; overflow: hidden;">
<p style="position: absolute; left: 15px; top: 13px; margin: 0; font-size: 30px; line-height: 0.95; font-weight: 600; letter-spacing: -0.04em; color: #12161c;">Spring<br>sessions</p>
<div style="position: absolute; left: 106px; top: 81px; width: 81px; height: 81px; border-radius: 50%; background: #ffb38a;"></div>
<svg viewBox="0 0 400 190" width="216" height="103" aria-hidden="true" style="position: absolute; left: 0; bottom: 0;"><path d="M0 70 Q90 10 190 52 T400 40 V190 H0Z" fill="#9fd8bd"/><path d="M0 120 Q120 80 240 112 T400 100 V190 H0Z" fill="#7fb49a"/></svg>
</div>
<span aria-hidden="true" style="position: absolute; left: -14px; top: -14px; width: 10px; height: 10px; border-top: 1px solid var(--line-control); border-left: 1px solid var(--line-control);"></span>
<span aria-hidden="true" style="position: absolute; right: -14px; top: -14px; width: 10px; height: 10px; border-top: 1px solid var(--line-control); border-right: 1px solid var(--line-control);"></span>
<span aria-hidden="true" style="position: absolute; left: -14px; bottom: -14px; width: 10px; height: 10px; border-bottom: 1px solid var(--line-control); border-left: 1px solid var(--line-control);"></span>
<span aria-hidden="true" style="position: absolute; right: -14px; bottom: -14px; width: 10px; height: 10px; border-bottom: 1px solid var(--line-control); border-right: 1px solid var(--line-control);"></span>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: -34px; display: flex; align-items: center; gap: 6px;">
<span style="flex: 1; height: 8px; margin-top: 8px; border-top: 1px solid var(--line-control); border-left: 1px solid var(--line-control);"></span>
<span style="font-family: var(--font-mono); font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.02em; color: var(--ink-muted);">2160 px</span>
<span style="flex: 1; height: 8px; margin-top: 8px; border-top: 1px solid var(--line-control); border-right: 1px solid var(--line-control);"></span>
</div>
<div aria-hidden="true" style="position: absolute; top: 0; bottom: 0; right: -38px; display: flex; flex-direction: column; align-items: center; gap: 6px;">
<span style="flex: 1; width: 8px; margin-right: 8px; border-right: 1px solid var(--line-control); border-top: 1px solid var(--line-control);"></span>
<span style="writing-mode: vertical-rl; font-family: var(--font-mono); font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.02em; color: var(--ink-muted);">2700 px</span>
<span style="flex: 1; width: 8px; margin-right: 8px; border-right: 1px solid var(--line-control); border-bottom: 1px solid var(--line-control);"></span>
</div>
</div>
</div>

<div style="flex: 1 1 300px; min-width: 0; box-sizing: border-box; padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 14px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted);">Format</span>
<x-import component-from-global-scope="TechnicalPastel.Segmented" label="Format" items="{{ formats }}" default-value="png"></x-import>
</div>
<div style="display: flex; flex-direction: column; gap: 4px;">
<x-import component-from-global-scope="TechnicalPastel.ValueField" label="Scale" default-value="2" min="0.5" max="4" step="0.5" precision="1" unit="×"></x-import>
<x-import component-from-global-scope="TechnicalPastel.ValueField" label="Quality" default-value="90" min="0" max="100" unit="%" disabled="true"></x-import>
<span style="font-size: 11px; line-height: 14px; color: var(--ink-muted);">PNG is lossless, so quality doesn't apply.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted);">Color profile</span>
<x-import component-from-global-scope="TechnicalPastel.Segmented" label="Color profile" size="sm" items="{{ profiles }}" default-value="srgb"></x-import>
</div>
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 2px;">
<legend style="padding: 0; margin-bottom: 6px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted);">Frames</legend>
<label style="display: flex; align-items: center; gap: 10px; height: 28px; padding: 0 6px; border-radius: var(--radius-sm); cursor: pointer;"><input type="checkbox" checked style="margin: 0; width: 14px; height: 14px; accent-color: var(--accent);"><span style="flex: 1;">Poster</span><span style="font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted);">1080 × 1350</span></label>
<label style="display: flex; align-items: center; gap: 10px; height: 28px; padding: 0 6px; border-radius: var(--radius-sm); cursor: pointer;"><input type="checkbox" checked style="margin: 0; width: 14px; height: 14px; accent-color: var(--accent);"><span style="flex: 1;">Square post</span><span style="font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted);">1080 × 1080</span></label>
<label style="display: flex; align-items: center; gap: 10px; height: 28px; padding: 0 6px; border-radius: var(--radius-sm); cursor: pointer;"><input type="checkbox" style="margin: 0; width: 14px; height: 14px; accent-color: var(--accent);"><span style="flex: 1;">Story 9:16</span><span style="font-family: var(--font-mono); font-size: 11px; color: var(--ink-muted);">1080 × 1920</span></label>
</fieldset>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 12px 12px 20px; border-top: 1px solid var(--line);">
<span style="flex: 1; min-width: 180px; font-family: var(--font-mono); font-size: 11px; line-height: 14px; font-weight: 500; letter-spacing: 0.02em; color: var(--ink-muted);">2 files · about 6.8 MB · Downloads/Technical Pastel</span>
<x-import component-from-global-scope="TechnicalPastel.Button">Cancel</x-import>
<x-import component-from-global-scope="TechnicalPastel.Button" variant="primary" icon="export">Export 2 frames</x-import>
</div>
</div>

<div role="status" style="position: relative; display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 14px; background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-popover);">
<x-import component-from-global-scope="TechnicalPastel.Icon" name="check" size="20"></x-import>
<span>Square post exported</span>
<span style="font-family: var(--font-mono); font-size: 11px; line-height: 14px; color: var(--ink-muted);">2160 × 2160 · 3.1 MB</span>
<x-import component-from-global-scope="TechnicalPastel.Button" variant="ghost" size="sm">Show in folder</x-import>
</div>
</div>
<script type="text/plain" id="screen-logic">
class Component extends DCLogic {
  renderVals() {
    return {
      formats: [
        { value: 'png', label: 'PNG' },
        { value: 'jpg', label: 'JPG' },
        { value: 'pdf', label: 'PDF' },
        { value: 'svg', label: 'SVG' }
      ],
      profiles: [
        { value: 'srgb', label: 'sRGB' },
        { value: 'p3', label: 'Display P3' }
      ]
    };
  }
}
</script>
<script src="technical-pastel/render.js"></script>
</body>
</html>
